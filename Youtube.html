<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="asset/css/style.css">
    <title>Youtube</title>
</head>
<body>
    <div id="navbar">
        <div id="logoyt">
            <div class="menu">☰</div>
            <div class="logo">
                <img src="asset/image/ytlogo.png" alt="Youtube">
            </div>
        </div>

        <div id="searchbar">
            <div class="box">
                <form action="result">
                        <input type="search" placeholder="Search" autocorrect="off" autocomplete="off" autocapitalize="off">
                    <div class="searchbtn">
                        <img src="asset/image/search.png" alt="Searchbtn">
                    </div>
                </form>
            </div>

            <div class="mic">
                <img src="asset/image/mic.png" alt="mic">
            </div>
        </div>

        <div id="user">
            <div class="setting">⋮</div>
            <div class="profile">
                <button class="signin-btn">
                    Sign In
            </button>
            </div>
        </div>
    </div>


    <div id="content">
        <div id="sidebar">
            <div class="opts">
                <hr>
                <section>
                    <ul>
                        <li class="home">
                            <img src="asset/image/home.png" alt="home">
                            <span>Home</span>
                        </li>
                        <li class="short">
                            <img src="asset/image/short.png" alt="short">
                            <span>Shorts</span>
                        </li>
                        <li class="sub">
                            <img src="asset/image/sub.png" alt="sub">
                            <span>Subscription</span>
                        </li>
                        <li class="you">
                            <img src="asset/image/you.png" alt="you">
                            <span>You</span>
                        </li>
                    </ul>
                </section>
                <hr>

                <div class="info">
                    Sign in to like, comment and subscribe.
                </div>
                <hr>
            </div>
        </div>

        <div id="content-aria"></div>
    </div>
</body>
</html>
