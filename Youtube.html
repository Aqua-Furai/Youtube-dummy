<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="asset/css/style.css">
    <title>Youtube</title>
</head>
<body>
    <div id="navbar">
        <div id="logoyt">
            <div class="menu">☰</div>
            <div class="logo">
                <img src="asset/image/ytlogo.png" alt="Youtube">
            </div>
        </div>

        <div id="searchbar">
            <div class="box">
                <form action="result">
                        <input type="search" placeholder="Search" autocorrect="off" autocomplete="off" autocapitalize="off">
                    <div class="searchbtn">
                        <img src="asset/image/search.png" alt="Searchbtn">
                    </div>
                </form>
            </div>

            <div class="mic">
                <img src="asset/image/mic.png" alt="mic">
            </div>
        </div>

        <div id="user">
            <div class="setting">⋮</div>
            <div class="profile">
                <button class="signin-btn">
                    Sign In
            </button>
            </div>
        </div>
    </div>


    <div id="content">
        <div id="sidebar">
            <div class="opts">
                <hr>
                <section>
                    <ul>
                        <li class="home">
                            <img src="asset/image/home.png" alt="home">
                            <span>Home</span>
                        </li>
                        <li class="short">
                            <img src="asset/image/short.png" alt="short">
                            <span>Shorts</span>
                        </li>
                        <li class="sub">
                            <img src="asset/image/sub.png" alt="sub">
                            <span>Subscription</span>
                        </li>
                        <li class="you">
                            <img src="asset/image/you.png" alt="you">
                            <span>You</span>
                        </li>
                    </ul>
                </section>
                <hr>

                <div class="info">
                    Sign in to like, comment and subscribe.
                </div>
                <hr>

                <div class="exploreh">
                    <span>Explore</span>
                </div>
                <div class="explore">
                    <ul>
                        <li class="music">
                            <img src="asset/image/music.png" alt="Music">
                            <span>Music</span>
                        </li>
                        <li class="gaming">
                            <img src="asset/image/gaming.png" alt="Gaming">
                            <span>Gaming</span>
                        </li>
                        <li class="news">
                            <img src="asset/image/news.png" alt="News">
                            <Span>News</Span>
                        </li>
                        <li class="show-more">
                            <img src="asset/image/more.png" alt="More">
                            <span>Show More</span>
                        </li>
                    </ul>
                </div>
                <hr>
            </div>
        </div>

        <div id="content-aria">
            <div class="no-internet">
                <div class="title">
                    Try searching to get started
                </div>
                <div class="sub-title">
                    Start watching videos to help us build a feed of videos that you'll love.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
